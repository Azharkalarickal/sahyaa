<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1015" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sahyaa" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Sahyaa — Literary Social & Publishing Platform</title>
    <meta name="description" content="A sanctuary for poets, storytellers, and readers. Discover contemporary literature, curated digital magazines, and thoughtful literary discourse." />
    <!-- Google Fonts: Playfair Display, Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['Playfair Display', 'Georgia', 'serif'],
              literary: ['Cormorant Garamond', 'Georgia', 'serif'],
              ui: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              sahya: {
                darkest: '#06231c',
                deep: '#0a4335',
                primary: '#10b981',
                light: '#34d399',
                gold: '#d97706',
                goldLight: '#fbbf24',
                surface: '#141b24',
                surfaceHover: '#1c2633',
                border: '#24303f',
                bg: '#0c1015',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0c1015] text-[#e2e8f0] antialiased selection:bg-emerald-800/40 selection:text-emerald-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('🌿 Sahyaa PWA ServiceWorker registered', reg.scope),
            (err) => console.log('ServiceWorker registration failed', err)
          );
        });
      }
    </script>
  </body>
</html>
